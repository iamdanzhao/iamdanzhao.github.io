<!DOCTYPE html>
<html>
<head>
    <title>TransitScreen</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@200;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Public Sans';
            background-color: #000;
            margin: 24px;
            color: #fff;
        }

        h1 {
            margin-left: 24px;
            margin-bottom: -12px;
            /* text-transform: uppercase; */
        }

        .current-time {
            color: #77c4e4;
            font-size: 325%;
            font-weight: 700;
            margin-right: 12px;
        }

        .current-date {
            color: #fff;
            font-weight: 700;
            font-size: 175%;
        }

        h2 {
            font-size: 200%;
        }
        
        .column {
            float: left;
            width: 50%;
        }

        .transit-unit {
            background-color: rgb(31, 31, 31);
            margin: 8px;
            margin-bottom: 12px;
            border-radius: 8px;
            padding: 12px 18px;
        }

        .section-header {
            border-bottom: 1px dotted gray;
            margin-bottom: 6px;
            margin-top: 6px;
            padding-bottom: 6px;
        }

        .section-header * {
            display: inline;
            vertical-align: middle;
        }

        .section-header-direction {
            font-weight: 400;
            /* text-transform: uppercase; */
            /* font-size: 60%; */
        }

        h4 {
            font-size: 150%;
            /* text-transform: uppercase; */
            margin: 12px 0 6px 0;
        }

        /* Clear floats after the columns */
        .row:after {
            content: "";
            display: table;
            clear: both;
        }

        .line-red {
            background-color: #DA291C;
            color: white;
        }

        .bike-available {
            background-color: rgb(62, 155, 89);
            color: white;
        }

        .bike-low {
            background-color: rgb(239, 178, 86);
            color: black;
        }

        .bike-none {
            background-color: rgb(85, 83, 80);
            color: white;
        }

        .train-node.line-empty {
            height: 108px;
            background-color: rgb(61, 61, 61);
            color: darkgray;
            /* border: 1px solid #626262; */
        }

        .train-node {
            display: inline-block;
            padding: 16px 20px;
            margin: 8px;
            border-radius: 8px;
            height: 108px;
            width: calc(33.3% - 54px);
        }

        .train-node:nth-child(3n+1) {
            margin-left: 0;
        }

        .train-node:nth-child(3n+3) {
            margin-right: 0;
        }

        .train-node-wrapper {
            margin: 0;
        }

        .train-node-wrapper:last-child {
            margin-bottom: 0;
        }

        .train-node-time {
            font-size: 525%;
            font-weight: bold;
            line-height: 100%;
        }

        .train-node-label {
            text-transform: uppercase;
            font-size: 150%;
        }

        .train-node-dest {
            font-size: 160%;
            display: block;
            margin-top: -4px;
        }

        .bus-node {
            background-color: rgb(82, 91, 99);
        }

        .info-panel-time {
            display: block;
        }

        .info-panel-weather {
            display: block;
        }

        @media screen and (min-width: 1700px) {
            body {
                font-size: 115%;
            }

            h1 {
                font-size: 300%;
            }

            .train-node, .train-node.line-empty {
                height: 120px;
            }
        }

        @media screen and (max-width: 1200px) {
            .column {
                width: 100% !important;
            }
        }

    </style>
</head>
<body>    
    <h1 id="current-time-header">Get moving, you're probably late!</h1>
    <div class="row">
        <div class="column">
            <div class="transit-unit">
                <div class="section-header">
                    <h2>BlueBikes</h2>
                </div>
                <div class="train-node-wrapper" id="bikes-all"></div>
            </div>
        </div>
        <div class="column">
            <div class="transit-unit" id="container-metrorail">
                <div class="section-header">
                    <h2>Central <span class="section-header-direction">Braintree/Ashmont</span></h2>
                </div>
                <div class="train-node-wrapper" id="trains-container-1"></div>
                <div class="section-header">
                    <h2>Harvard <span class="section-header-direction">Alewife</span></h2>
                </div>
                <div class="train-node-wrapper" id="trains-container-2"></div>
            </div>
        </div>
    </div>
    
    <script type="text/javascript">
        const mbta_api = '5f06342877504bcca1663226472114d0';
        const refresh_rate = 30000; // 30 seconds

        // Header
        function LoadBasics() {
            d = new Date();

            var curTime = d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit' });
            var curDate = d.toLocaleDateString("en-US", {weekday: "short", day: "numeric", month: "short", year: "numeric"});

            document.getElementById("current-time-header").innerHTML = "<span class=\"current-time\">" + curTime + "</span> <span class=\"current-date\">" + curDate;
        }

        function LoadTrains() {
            $(function() {
                var params = {
                    "api_key": mbta_api,
                };

                // central - inbound
            
                $.ajax({
                    url: "https://api-v3.mbta.com/predictions?filter[stop]=70069&" + $.param(params),
                    type: "GET",
                })
                .done(function(data) {
                    var trains = data.data;
                    max_trains = 6;

                    document.getElementById("trains-container-1").innerHTML = "";

                    for (let i = 0; i < Math.min(trains.length, max_trains); i++) {
                        var container = document.getElementById("trains-container-1");
                        var arrival = new Date(trains[i].attributes.arrival_time);
                        var now = new Date();
                        var diff = Math.floor((arrival - now) / 1000 / 60);
                        if (diff < 0) diff = 0;

                        container.innerHTML += "<div class=\"train-node line-red\"><span class=\"train-node-time\">" + diff + "</span><span class=\"train-node-label\">" + "min" + "</span><span class=\"train-node-dest\">" + "Inbound" + "</span></div>"
                    }

                    if (document.getElementById("trains-container-1").innerHTML === "")
                        document.getElementById("trains-container-1").innerHTML = "<div class=\"train-node line-empty\"><span class=\"train-node-time\">∞</span><span class=\"train-node-label\">min</span><span class=\"train-node-dest\">No train</span></div>";
                })
                .fail(function() {
                    document.getElementById("trains-container-1").innerHTML = "<div class=\"train-node line-empty\"><span class=\"train-node-time\">∞</span><span class=\"train-node-label\">min</span><span class=\"train-node-dest\">API error</span></div>";
                });

                // harvard - outbound

                $.ajax({
                    url: "https://api-v3.mbta.com/predictions?filter[stop]=70068&" + $.param(params),
                    type: "GET",
                })
                .done(function(data) {
                    var trains = data.data;
                    max_trains = 6;

                    document.getElementById("trains-container-2").innerHTML = "";

                    for (let i = 0; i < Math.min(trains.length, max_trains); i++) {
                        var container = document.getElementById("trains-container-2");
                        var arrival = new Date(trains[i].attributes.arrival_time);
                        var now = new Date();
                        var diff = Math.floor((arrival - now) / 1000 / 60);
                        if (diff < 0) diff = 0;

                        container.innerHTML += "<div class=\"train-node line-red\"><span class=\"train-node-time\">" + diff + "</span><span class=\"train-node-label\">" + "min" + "</span><span class=\"train-node-dest\">" + "Inbound" + "</span></div>"
                    }

                    if (document.getElementById("trains-container-2").innerHTML === "")
                        document.getElementById("trains-container-2").innerHTML = "<div class=\"train-node line-empty\"><span class=\"train-node-time\">∞</span><span class=\"train-node-label\">min</span><span class=\"train-node-dest\">No train</span></div>";
                })
                .fail(function() {
                    document.getElementById("trains-container-2").innerHTML = "<div class=\"train-node line-empty\"><span class=\"train-node-time\">∞</span><span class=\"train-node-label\">min</span><span class=\"train-node-dest\">API error</span></div>";
                });
            });
        }
        
        // Bike
        function LoadBikes() {
            $.getJSON('https://gbfs.lyft.com/gbfs/1.1/bos/en/station_status.json', function(data) {
                stations = [96, 221, 515, 89, 176, 115, 76, 68, 75];
                names = ['B\'way @ CPL', 'Ware St.', 'MA @ UPS', 'MA @ HLS', "MA @ Lesley", "MA @ Porter", "MA @ Cantab", "MA @ PF", "MA @ Jaho"];

                document.getElementById("bikes-all").innerHTML = "";

                for (var i = 0; i < stations.length; i++) {
                    const available = data.data.stations.filter(d => parseInt(d.legacy_id) === stations[i])[0].num_bikes_available;
                    const ebikes = data.data.stations.filter(d => parseInt(d.legacy_id) === stations[i])[0].num_ebikes_available;
                    const free = data.data.stations.filter(d => parseInt(d.legacy_id) === stations[i])[0].num_docks_available;

                    const total = available + free;

                    className = "bike-available";

                    if (available == 0) {
                        className = "bike-none"
                    }
                    else if (available <= 2) {
                        className = "bike-low"
                    }

                    ebikes_ind = "";

                    if (ebikes == available && available > 0) {
                        ebikes_ind = "*";
                    }

                    document.getElementById("bikes-all").innerHTML += "<div class=\"train-node " + className + "\"><span class=\"train-node-time\">" + available + ebikes_ind + "</span><span class=\"train-node-label\">/" + total + "</span><span class=\"train-node-dest\">" + names[i] + "</span></div>"
                }
            });
        }
    
        // Load everything
        function LoadAll() {
            LoadTrains();
            LoadBikes();
        }
        
        LoadAll();
        setInterval(LoadAll, refresh_rate);

        LoadBasics();
        setInterval(LoadBasics, 5000);
    </script>
</body>
</html>
